<!DOCTYPE html>

<html lang="en">


<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <h1>Contact Us</h1><br>

    <form action="https://webdevbasics.net/scripts/demo.php" method="post">
        <fieldset class="box1">

            <legend class="pi">Personal Info</legend>
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname">

            <br>


            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname">

            <br>

            <label for="phone">Contact Phone</label>
            <input type="text" id="phone" name="phone">

            <br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email">

        </fieldset>
        <fieldset class="box2">
            <legend class="md">Message Details</legend>
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What can we do for you?">
            <br>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="20" cols="50"
                placeholder="Write your message here.."></textarea>
        </fieldset>
        <fieldset class="rate">
            <legend class="rye">Rate Your Expeerience</legend>

            <input type="radio" id="great" name="rating" value="1">
            <label for="great">Great</label><br>

            <input type="radio" id="good" name="rating" value="2">
            <label for="good">Good</label><br>

            <input type="radio" id="poor" name="rating" value="3">
            <label for="poor">Poor</label><br>
        </fieldset><br>

        <input type="submit" value="Send Message">
        <input type="reset" value="Reset">

    </form>
</body>
