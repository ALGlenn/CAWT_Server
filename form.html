<!DOCTYPE html>

<html lang="en">


<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <div>
        <h2>Contact Us</h2>
    </div>
    <form action="https://webdevbasics.net/scripts/demo.php" method="post">
        <fieldset class="box1">
            <div>
                <legend class="pi">Personal Info</legend>
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" name="firstname" value="Amanda">
            </div>
            <br>

            <div>
                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" name="lastname" value="Glenn">
            </div>
            <br>
            <div>
                <label for="phone">Contact Phone</label>
                <input type="text" id="phone" name="phone" value="562 533 2345">
            </div>
            <br>
            <div>
                <label for="email">Email</label>
                <input type="text" id="email" name="email" value="ALGlenn@my.canyons.edu">
            </div>
        </fieldset>
        <fieldset class="box2">
            <legend class="md">Message Details</legend>
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What can we do for you?">
            <br>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="20" cols="50"
                placeholder="Write your message here.."></textarea>
        </fieldset>
        <input type="submit" value="Send Message">
        <input type="reset" value="reset">

    </form>
</body>
